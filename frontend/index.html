<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="RAG-Anchor：在 PDF 原文中检索证据、提问并定位引用。"
    />
    <title>RAG-Anchor</title>
  </head>
  <body>
    <div class="app">
      <aside
        class="sidebar library-pane"
        id="library-pane"
        aria-label="文献库"
      >
        <header class="library-header">
          <div class="brand">
            <span class="brand-mark" aria-hidden="true">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              >
                <path d="M12 3v7" stroke-linecap="round" />
                <circle cx="12" cy="12" r="2.4" />
                <path d="M12 14.4V21" stroke-linecap="round" />
                <path
                  d="M6 8.5a7.2 7.2 0 0 0-2.4 5.4A8.4 8.4 0 0 0 12 22a8.4 8.4 0 0 0 8.4-8.1A7.2 7.2 0 0 0 18 8.5"
                  stroke-linecap="round"
                />
              </svg>
            </span>
            <h1 class="brand-name">RAG-Anchor</h1>
          </div>
          <div class="connection" id="connection-status" data-state="idle">
            <span class="connection-dot" aria-hidden="true"></span>
            <span id="connection-label">正在连接…</span>
          </div>
          <button
            class="icon-button drawer-close"
            id="library-close"
            type="button"
            title="关闭文献库"
            aria-label="关闭文献库"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path d="m6 6 12 12M18 6 6 18" stroke-linecap="round" />
            </svg>
          </button>
        </header>

        <div class="library-scroll">
          <section class="panel upload-panel">
            <label
              class="upload-zone"
              id="upload-zone"
              for="upload-input"
              title="支持 PDF，最大 20 MB"
            >
              <input
                id="upload-input"
                type="file"
                accept=".pdf,application/pdf"
                hidden
              />
              <span class="upload-icon" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                >
                  <path d="M12 16V4" stroke-linecap="round" />
                  <path
                    d="m7.5 8.5 4.5-4.5 4.5 4.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                  <path
                    d="M5 15v3.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V15"
                    stroke-linecap="round"
                  />
                </svg>
              </span>
              <span class="upload-title">上传 PDF</span>
            </label>
            <p
              class="upload-status"
              id="upload-status"
              role="status"
              aria-live="polite"
            ></p>
          </section>

          <section class="panel documents-panel">
            <div class="panel-heading">
              <h2>文献库</h2>
              <span class="count-badge" id="document-count">0</span>
            </div>
            <div class="document-list" id="document-list"></div>
          </section>

          <details class="panel chunk-panel" aria-label="Chunk 检索">
            <summary class="chunk-summary">
              <span>Chunk 检索</span>
              <svg
                class="summary-chevron"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.9"
                aria-hidden="true"
              >
                <path
                  d="m8 10 4 4 4-4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </summary>
            <div class="chunk-body">
              <form class="search-form" id="chunk-form">
                <textarea
                  id="chunk-input"
                  rows="2"
                  placeholder="输入原文词句…"
                  spellcheck="false"
                ></textarea>
                <div class="search-controls">
                  <label class="checkbox">
                    <input id="chunk-match-case" type="checkbox" checked />
                    <span>区分大小写</span>
                  </label>
                  <button
                    class="primary-button"
                    id="chunk-search-button"
                    type="submit"
                    disabled
                  >
                    检索
                  </button>
                </div>
              </form>
              <p class="search-hint" id="chunk-hint"></p>
              <div class="results-toolbar">
                <span class="results-position" id="chunk-position">0 / 0</span>
                <div class="hit-nav">
                  <button
                    class="icon-button"
                    id="chunk-prev"
                    type="button"
                    title="上一页结果"
                    aria-label="上一页结果"
                    disabled
                  >
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.9"
                    >
                      <path
                        d="m14 6-6 6 6 6"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      />
                    </svg>
                  </button>
                  <button
                    class="icon-button"
                    id="chunk-next"
                    type="button"
                    title="下一页结果"
                    aria-label="下一页结果"
                    disabled
                  >
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.9"
                    >
                      <path
                        d="m10 6 6 6-6 6"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      />
                    </svg>
                  </button>
                </div>
              </div>
              <div class="results-list chunk-results" id="chunk-results"></div>
            </div>
          </details>
        </div>

        <footer class="library-footer">
          <div class="panel-heading">
            <h2>索引</h2>
            <span class="status-badge" id="index-status">未索引</span>
          </div>
          <div class="index-row">
            <button
              class="ghost-button"
              id="index-button"
              type="button"
              aria-describedby="index-detail"
              disabled
            >
              建立索引
            </button>
            <span class="panel-hint" id="index-detail"></span>
          </div>
          <div class="index-row">
            <button
              class="ghost-button"
              id="semantic-index-button"
              type="button"
              aria-describedby="semantic-index-detail"
              disabled
            >
              建立语义索引
            </button>
            <span class="panel-hint" id="semantic-index-detail"></span>
          </div>
        </footer>
      </aside>

      <main class="viewer-pane" aria-label="PDF 阅读器">
        <header class="viewer-toolbar">
          <button
            class="icon-button pane-toggle"
            id="library-toggle"
            type="button"
            title="打开文献库"
            aria-label="打开文献库"
            aria-controls="library-pane"
            aria-expanded="false"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round" />
            </svg>
          </button>

          <div class="viewer-doc">
            <h2 id="viewer-title" title="未选择文档">未选择文档</h2>
            <p id="viewer-subtitle"></p>
          </div>

          <div class="viewer-controls">
            <div class="control-group" aria-label="页码控制">
              <button
                class="icon-button"
                id="prev-page"
                type="button"
                title="上一页"
                aria-label="上一页"
                disabled
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.9"
                >
                  <path
                    d="m14 6-6 6 6 6"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>
              <input
                class="page-input"
                id="page-input"
                type="number"
                min="1"
                value="1"
                aria-label="当前页码"
                disabled
              />
              <span class="page-total">/ <span id="page-total">0</span></span>
              <button
                class="icon-button"
                id="next-page"
                type="button"
                title="下一页"
                aria-label="下一页"
                disabled
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.9"
                >
                  <path
                    d="m10 6 6 6-6 6"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>
            </div>

            <div class="control-group" aria-label="缩放控制">
              <button
                class="icon-button"
                id="zoom-out"
                type="button"
                title="缩小"
                aria-label="缩小"
                disabled
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.9"
                >
                  <path d="M6 12h12" stroke-linecap="round" />
                </svg>
              </button>
              <span class="zoom-label" id="zoom-label">100%</span>
              <button
                class="icon-button"
                id="zoom-in"
                type="button"
                title="放大"
                aria-label="放大"
                disabled
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.9"
                >
                  <path d="M12 6v12M6 12h12" stroke-linecap="round" />
                </svg>
              </button>
              <button
                class="ghost-button"
                id="fit-width"
                type="button"
                title="适合宽度"
                disabled
              >
                适合宽度
              </button>
            </div>
          </div>

          <button
            class="icon-button pane-toggle"
            id="inspector-toggle"
            type="button"
            title="打开问答"
            aria-label="打开问答"
            aria-controls="inspector-pane"
            aria-expanded="false"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path d="M5 5h14v11H9l-4 3V5Z" stroke-linejoin="round" />
              <path d="M9 9h6M9 12h4" stroke-linecap="round" />
            </svg>
          </button>
        </header>

        <div class="find-bar">
          <form class="find-form" id="search-form">
            <span class="find-icon" aria-hidden="true">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              >
                <circle cx="11" cy="11" r="6.5" />
                <path d="m16 16 4 4" stroke-linecap="round" />
              </svg>
            </span>
            <textarea
              id="search-input"
              rows="1"
              placeholder="在原文中查找…"
              spellcheck="false"
            ></textarea>
            <label class="checkbox">
              <input id="match-case" type="checkbox" checked />
              <span>区分大小写</span>
            </label>
            <button
              class="primary-button"
              id="search-button"
              type="submit"
              disabled
            >
              搜索
            </button>
          </form>
          <p class="search-hint" id="search-hint"></p>
        </div>

        <section
          class="panel results-panel search-results"
          id="search-results"
          aria-label="命中结果"
        >
          <div class="results-head">
            <div class="panel-heading">
              <h2>命中结果</h2>
              <span class="count-badge" id="result-count">0</span>
            </div>
            <div class="results-toolbar">
              <span class="results-position" id="hit-position">—</span>
              <div class="hit-nav">
                <button
                  class="icon-button"
                  id="hit-prev"
                  type="button"
                  title="上一命中"
                  aria-label="上一命中"
                  disabled
                >
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.9"
                  >
                    <path
                      d="m14 6-6 6 6 6"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                </button>
                <button
                  class="icon-button"
                  id="hit-next"
                  type="button"
                  title="下一命中"
                  aria-label="下一命中"
                  disabled
                >
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.9"
                  >
                    <path
                      d="m10 6 6 6-6 6"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                </button>
              </div>
            </div>
          </div>
          <div class="results-list" id="results-list"></div>
        </section>

        <div class="viewer-stage" id="viewer-stage">
          <div class="viewer-empty" id="viewer-empty">
            <span class="empty-illustration" aria-hidden="true">
              <svg
                viewBox="0 0 64 64"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
              >
                <path d="M16 8h22l10 10v38H16V8Z" stroke-linejoin="round" />
                <path d="M38 8v10h10" stroke-linejoin="round" />
                <path d="M23 30h18M23 38h18M23 46h11" stroke-linecap="round" />
                <circle cx="41" cy="46" r="7" fill="var(--surface-2)" />
                <path d="m46 51 6 6" stroke-linecap="round" />
              </svg>
            </span>
            <p class="empty-title">未选择文档</p>
            <p class="empty-copy">上传或选择 PDF 开始阅读。</p>
          </div>

          <div class="viewer-loading" id="viewer-loading" hidden>
            <span class="spinner" aria-hidden="true"></span>
            <span>正在加载 PDF…</span>
          </div>

          <div class="viewer-error" id="viewer-error" hidden>
            <p class="error-title">PDF 加载失败</p>
            <p class="error-copy" id="viewer-error-message"></p>
          </div>

          <div class="page-shell" id="page-shell" hidden>
            <canvas id="pdf-canvas"></canvas>
            <div
              class="highlight-layer"
              id="highlight-layer"
              aria-hidden="true"
            ></div>
          </div>
        </div>
      </main>

      <aside class="inspector-pane" id="inspector-pane" aria-label="证据问答">
        <header class="inspector-header">
          <div class="inspector-heading">
            <h2>问答</h2>
          </div>
          <button
            class="icon-button drawer-close"
            id="inspector-close"
            type="button"
            title="关闭问答"
            aria-label="关闭问答"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path d="m6 6 12 12M18 6 6 18" stroke-linecap="round" />
            </svg>
          </button>
        </header>

        <div class="qa-input">
          <form class="search-form qa-form" id="qa-form">
            <div class="qa-select-row">
              <label class="select-field">
                <span class="field-label">检索方式</span>
                <select class="qa-mode" id="qa-retrieval-mode">
                  <option value="literal" selected>关键词</option>
                  <option value="semantic">语义</option>
                </select>
              </label>
              <label class="select-field">
                <span class="field-label">回答模式</span>
                <select class="qa-mode" id="qa-mode">
                  <option value="evidence_only" selected>证据展示</option>
                  <option value="grounded_generation">AI 生成</option>
                </select>
              </label>
            </div>
            <textarea
              id="qa-question"
              rows="3"
              placeholder="输入问题…"
              spellcheck="false"
            ></textarea>
            <input
              class="qa-query"
              id="qa-query"
              type="text"
              placeholder="检索词（可选）"
              spellcheck="false"
            />
            <div class="qa-controls">
              <button
                class="primary-button"
                id="qa-submit"
                type="submit"
                disabled
              >
                提问
              </button>
            </div>
          </form>
          <p class="search-hint" id="qa-hint"></p>
        </div>

        <div class="qa-output">
          <div class="qa-empty" id="qa-empty">暂无回答</div>
          <section class="qa-summary" id="qa-summary" hidden>
            <div class="qa-summary-head">
              <h3 id="qa-summary-title">检索结果</h3>
              <span class="qa-summary-count" id="qa-summary-count"></span>
            </div>
            <p class="qa-summary-note" id="qa-summary-note"></p>
            <details class="qa-answer-details" id="qa-answer-details" hidden>
              <summary>检索说明</summary>
              <p id="qa-answer-details-text"></p>
            </details>
          </section>
          <div class="qa-answer" id="qa-answer" hidden aria-live="polite">
            <p class="qa-answer-text" id="qa-answer-text"></p>
          </div>
          <div class="qa-citations" id="qa-citations"></div>
        </div>
      </aside>
    </div>

    <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>

    <div
      class="toast-region"
      id="toast-region"
      aria-atomic="false"
    ></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
